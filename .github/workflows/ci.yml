name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install package (builds the C++ extension)
        run: python -m pip install -e ".[dev]"

      - name: Python tests
        run: python -m pytest -q

      - name: Configure C++ tests (Linux, Ninja + GCC)
        if: runner.os == 'Linux'
        run: |
          python -m pip install ninja
          cmake -S cpp -B build-cpp -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release -DMNA_BUILD_TESTS=ON -DMNA_BUILD_PYTHON_MODULE=OFF

      - name: Configure C++ tests (Windows, Visual Studio)
        if: runner.os == 'Windows'
        run: cmake -S cpp -B build-cpp -DMNA_BUILD_TESTS=ON -DMNA_BUILD_PYTHON_MODULE=OFF

      - name: Build C++ tests
        run: cmake --build build-cpp --config Release --parallel

      - name: Run C++ tests
        run: ctest --test-dir build-cpp -C Release --output-on-failure

  sanitizers:
    name: ASan + UBSan (Linux, GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install ninja
      - name: Configure
        run: cmake -S cpp -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DMNA_BUILD_TESTS=ON -DMNA_ENABLE_SANITIZERS=ON -DMNA_BUILD_PYTHON_MODULE=OFF
      - name: Build
        run: cmake --build build-asan --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure

  coverage:
    name: C++ coverage (Linux, GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install ninja gcovr
      - name: Configure
        run: cmake -S cpp -B build-cov -G Ninja -DCMAKE_BUILD_TYPE=Debug -DMNA_BUILD_TESTS=ON -DMNA_ENABLE_COVERAGE=ON -DMNA_BUILD_PYTHON_MODULE=OFF
      - name: Build
        run: cmake --build build-cov --parallel
      - name: Test
        run: ctest --test-dir build-cov --output-on-failure
      - name: Coverage report
        run: gcovr --root . --filter cpp/src/ --filter cpp/include/ --gcov-ignore-parse-errors=negative_hits.warn_once_per_file --xml-pretty --xml coverage-cpp.xml --print-summary build-cov
      - uses: actions/upload-artifact@v5
        with:
          name: coverage-cpp
          path: coverage-cpp.xml
