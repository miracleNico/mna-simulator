name: Wheels

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    # Build the wheels whenever the compiled extension or its packaging changes;
    # the pure-Python package is covered by ci.yml on every push.
    branches: [dev, main]
    paths:
      - "cpp/**"
      - "pyproject.toml"
      - ".github/workflows/wheels.yml"
      - ".github/scripts/**"

jobs:
  wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      # pypa/cibuildwheel publishes no floating "v3" tag; pin a release.
      - uses: pypa/cibuildwheel@v3.4.1
        env:
          # One abi3 wheel (stable ABI, Python >= 3.12) per platform.
          CIBW_BUILD: "cp312-*"
          CIBW_ARCHS: "auto64"
          CIBW_SKIP: "*-musllinux_*"
          # The installed wheel must pass the whole suite (P6 exit criterion), not just import.
          # The script installs the test dependencies itself (cibuildwheel's Windows test venv has
          # no pip.exe) and runs pytest from a copy of tests/ outside the checkout, so the source
          # tree without a compiled _core cannot shadow the wheel.
          CIBW_TEST_COMMAND: python {project}/.github/scripts/test_wheel.py {project}
          # Bundle msvcp140.dll & co.: Python itself ships only vcruntime140*.dll.
          CIBW_BEFORE_BUILD_WINDOWS: pip install delvewheel
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: delvewheel repair -w {dest_dir} {wheel}

      - uses: actions/upload-artifact@v5
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # The abi3 wheel is built and tested under CPython 3.12 above; this job installs the same
  # wheel into CPython 3.13 and runs the suite again.
  test-wheel-py313:
    name: Test wheel on ${{ matrix.os }} / Python 3.13
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v5
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse
      - name: Install the wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --find-links wheelhouse mna-simulation
      - name: Run the suite against the installed wheel
        shell: bash
        run: python .github/scripts/test_wheel.py "$GITHUB_WORKSPACE"
